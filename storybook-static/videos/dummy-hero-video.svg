      <stop offset="0" stop-color="#182848"/>
      <stop offset="0.45" stop-color="#384089"/>
      <stop offset="1" stop-color="#f26a4f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="45%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".75"/>
      <stop offset=".35" stop-color="#ffd166" stop-opacity=".42"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
